<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond arrondi iOS -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Reflet haut gauche -->
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- Halo derrière la silhouette -->
  <ellipse cx="220" cy="310" rx="130" ry="125" fill="white" opacity="0.06"/>

  <!-- Corps / silhouette personne -->
  <!-- Tête -->
  <circle cx="210" cy="178" r="68" fill="white" opacity="0.95"/>
  <!-- Buste -->
  <path d="M85 415 C85 318 130 272 210 272 C290 272 335 318 335 415 Z"
        fill="white" opacity="0.92"/>

  <!-- Loupe dorée -->
  <!-- Cercle de la loupe -->
  <circle cx="350" cy="330" r="72" fill="none" stroke="#fbbf24" stroke-width="26" opacity="1"/>
  <!-- Intérieur loupe (légère teinte) -->
  <circle cx="350" cy="330" r="46" fill="#fbbf24" opacity="0.12"/>
  <!-- Manche -->
  <line x1="402" y1="383" x2="440" y2="422"
        stroke="#fbbf24" stroke-width="28" stroke-linecap="round"/>

  <!-- Reflet brillant sur la loupe -->
  <circle cx="332" cy="310" r="14" fill="white" opacity="0.3"/>
</svg>